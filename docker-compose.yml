version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: requisiciones_db
    environment:
      POSTGRES_DB: requisiciones_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d requisiciones_db"]
      interval: 3s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./Backend
    container_name: requisiciones_api
    ports:
      - "5005:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=db;Database=requisiciones_db;Username=postgres;Password=postgres
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./Frontend
    container_name: requisiciones_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data: